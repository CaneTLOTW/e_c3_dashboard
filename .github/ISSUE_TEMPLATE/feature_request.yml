name: Feature request
description: Suggest a portable, privacy-safe e-C3 Dashboard improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: State which existing Stellantis Vehicles entities or capabilities it requires.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: My request does not require credentials, a VIN, location history, or household-specific configuration to be committed.
          required: true
