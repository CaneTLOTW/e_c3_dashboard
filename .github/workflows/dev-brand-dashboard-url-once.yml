name: Dev brand dashboard URL once

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/dev-brand-dashboard-url-once.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Apply guarded brand URL migration
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {count}: {old[:100]!r}")
              file.write_text(text.replace(old, new, 1))

          dashboard = Path("custom_components/e_c3_dashboard/dashboard.py")
          text = dashboard.read_text()

          title_anchor = '    return f"{brand} ({ordinal})"\n\n\nasync def async_remove_dashboard_marker'
          title_insert = '''    return f"{brand} ({ordinal})"\n\n\ndef _dashboard_url_base_for_entry(hass, entry) -> str:\n    \"\"\"Return a generic brand-based base path for package dashboards.\"\"\"\n    brand = slugify(vehicle_brand_for_entry(hass, entry), separator=\"-\") or \"stellantis\"\n    return f\"{brand}-dashboard\"\n\n\ndef _available_dashboard_url_path(hass, entry, *, ignore: str | None = None) -> str:\n    \"\"\"Return the first free stable brand path without touching user panels.\"\"\"\n    lovelace = hass.data.get(LOVELACE_DATA)\n    base = _dashboard_url_base_for_entry(hass, entry)\n    candidate = base\n    suffix = 2\n    while (\n        candidate != ignore\n        and (\n            (lovelace is not None and candidate in lovelace.dashboards)\n            or frontend.async_panel_exists(hass, candidate)\n        )\n    ):\n        candidate = f\"{base}-{suffix}\"\n        suffix += 1\n    return candidate\n\n\nasync def async_remove_dashboard_marker'''
          if text.count(title_anchor) != 1:
              raise SystemExit("dashboard.py: dashboard title insertion anchor mismatch")
          text = text.replace(title_anchor, title_insert, 1)

          start = text.index("async def _async_has_matching_strategy")
          end = text.index("async def _async_repair_legacy_generated_dashboard", start)
          matching = '''async def _async_matching_strategy_url_path(hass, entry_id: str) -> str | None:\n    \"\"\"Return the URL path of a dashboard already targeting this entry.\"\"\"\n    lovelace = hass.data.get(LOVELACE_DATA)\n    if lovelace is None:\n        return None\n\n    package_entry_count = len(hass.config_entries.async_entries(DOMAIN))\n    for url_path, dashboard in lovelace.dashboards.items():\n        if not isinstance(url_path, str):\n            continue\n        try:\n            dashboard_config = await dashboard.async_load(False)\n        except HomeAssistantError:\n            continue\n        strategy = dashboard_config.get(\"strategy\")\n        if not isinstance(strategy, dict) or strategy.get(\"type\") not in {\n            AUTO_DASHBOARD_STRATEGY,\n            LEGACY_AUTO_DASHBOARD_STRATEGY,\n        }:\n            continue\n        selected_entry = strategy.get(\"entry_id\")\n        if selected_entry == entry_id:\n            return url_path\n        if selected_entry is None and package_entry_count == 1:\n            return url_path\n    return None\n\n\n'''
          text = text[:start] + matching + text[end:]

          migration_anchor = "async def _async_sync_generated_dashboard_metadata(\n"
          migration_pos = text.index(migration_anchor)
          migration = '''async def _async_migrate_generated_dashboard_url(\n    hass, entry, marker: dict[str, Any]\n) -> dict[str, Any]:\n    \"\"\"Move only a proven package-owned legacy dashboard to a brand path.\n\n    Home Assistant does not allow ``url_path`` in dashboard update fields, so\n    the safe migration is create-new -> copy strategy config -> register ->\n    remove-old. The marker and entry-bound strategy are both required before\n    any destructive step, and a conflicting user panel is never overwritten.\n    \"\"\"\n    current_url_path = marker.get(\"url_path\")\n    lovelace = hass.data.get(LOVELACE_DATA)\n    if (\n        not isinstance(current_url_path, str)\n        or not current_url_path.startswith(\"e-c3-\")\n        or lovelace is None\n    ):\n        return marker\n\n    old_dashboard = lovelace.dashboards.get(current_url_path)\n    if old_dashboard is None:\n        return marker\n    try:\n        config = await old_dashboard.async_load(False)\n    except HomeAssistantError:\n        return marker\n    strategy = config.get(\"strategy\")\n    if (\n        not isinstance(strategy, dict)\n        or strategy.get(\"type\") not in {\n            AUTO_DASHBOARD_STRATEGY,\n            LEGACY_AUTO_DASHBOARD_STRATEGY,\n        }\n        or strategy.get(\"entry_id\") != entry.entry_id\n    ):\n        return marker\n\n    desired_url_path = _available_dashboard_url_path(\n        hass, entry, ignore=current_url_path\n    )\n    if desired_url_path == current_url_path:\n        return marker\n\n    dashboards = lovelace_dashboard.DashboardsCollection(hass)\n    await dashboards.async_load()\n    old_item = next(\n        (\n            candidate\n            for candidate in dashboards.async_items()\n            if candidate.get(\"url_path\") == current_url_path\n        ),\n        None,\n    )\n    if old_item is None:\n        return marker\n\n    title = dashboard_title_for_entry(hass, entry)\n    new_item = None\n    new_dashboard = None\n    new_panel_registered = False\n    try:\n        new_item = await dashboards.async_create_item(\n            {\n                \"title\": title,\n                \"icon\": old_item.get(\"icon\", \"mdi:car-electric\"),\n                \"show_in_sidebar\": old_item.get(\"show_in_sidebar\", True),\n                \"require_admin\": old_item.get(\"require_admin\", False),\n                \"url_path\": desired_url_path,\n            }\n        )\n        new_dashboard = lovelace_dashboard.LovelaceStorage(hass, new_item)\n        await new_dashboard.async_save(config)\n        frontend.async_register_built_in_panel(\n            hass,\n            \"lovelace\",\n            frontend_url_path=desired_url_path,\n            require_admin=new_item[\"require_admin\"],\n            show_in_sidebar=new_item[\"show_in_sidebar\"],\n            sidebar_title=new_item[\"title\"],\n            sidebar_icon=new_item.get(\"icon\", \"mdi:lovelace\"),\n            config={\"mode\": MODE_STORAGE},\n        )\n        new_panel_registered = True\n    except (HomeAssistantError, ValueError):\n        _LOGGER.exception(\n            \"Could not create brand dashboard path /%s; keeping /%s\",\n            desired_url_path,\n            current_url_path,\n        )\n        if new_panel_registered:\n            frontend.async_remove_panel(\n                hass, desired_url_path, warn_if_unknown=False\n            )\n        if new_item is not None:\n            try:\n                await dashboards.async_delete_item(new_item[\"id\"])\n            except HomeAssistantError:\n                _LOGGER.debug(\"Could not remove failed dashboard metadata\", exc_info=True)\n        if new_dashboard is not None:\n            try:\n                await new_dashboard.async_delete()\n            except HomeAssistantError:\n                _LOGGER.debug(\"Could not remove failed dashboard config\", exc_info=True)\n        return marker\n\n    lovelace.dashboards[desired_url_path] = new_dashboard\n    frontend.async_remove_panel(hass, current_url_path, warn_if_unknown=False)\n    lovelace.dashboards.pop(current_url_path, None)\n    try:\n        await dashboards.async_delete_item(old_item[\"id\"])\n        await old_dashboard.async_delete()\n    except HomeAssistantError:\n        _LOGGER.warning(\n            \"Brand dashboard /%s is active, but legacy metadata for /%s could not be fully removed\",\n            desired_url_path,\n            current_url_path,\n            exc_info=True,\n        )\n\n    _LOGGER.info(\n        \"Migrated package dashboard /%s to /%s\",\n        current_url_path,\n        desired_url_path,\n    )\n    return {\n        **marker,\n        \"url_path\": desired_url_path,\n        \"previous_url_path\": current_url_path,\n        \"url_migrated\": True,\n    }\n\n\n'''
          text = text[:migration_pos] + migration + text[migration_pos:]

          ensure_start = text.index("async def async_ensure_dashboard")
          ensure = '''async def async_ensure_dashboard(hass, entry) -> str | None:\n    \"\"\"Create/migrate one package dashboard and return its actual URL path.\"\"\"\n    marker_store = _store(hass, entry.entry_id)\n    marker = await marker_store.async_load() or {}\n    if marker.get(\"handled\"):\n        migrated = await _async_migrate_generated_dashboard_url(hass, entry, marker)\n        if migrated != marker:\n            marker = migrated\n            await marker_store.async_save(marker)\n        await _async_repair_legacy_generated_dashboard(hass, entry, marker)\n        await async_sync_generated_dashboard_metadata(hass)\n        url_path = marker.get(\"url_path\")\n        if isinstance(url_path, str):\n            return url_path\n        return await _async_matching_strategy_url_path(hass, entry.entry_id)\n\n    lovelace = hass.data.get(LOVELACE_DATA)\n    if lovelace is None:\n        _LOGGER.warning(\"Lovelace is not ready; dashboard was not created yet\")\n        return None\n\n    matching_url_path = await _async_matching_strategy_url_path(\n        hass, entry.entry_id\n    )\n    if matching_url_path is not None:\n        await marker_store.async_save(\n            {\n                \"handled\": True,\n                \"reason\": \"existing_strategy\",\n                \"navigation_url_path\": matching_url_path,\n            }\n        )\n        await async_sync_generated_dashboard_metadata(hass)\n        return matching_url_path\n\n    url_path = _available_dashboard_url_path(hass, entry)\n    title = dashboard_title_for_entry(hass, entry)\n\n    dashboards = lovelace_dashboard.DashboardsCollection(hass)\n    await dashboards.async_load()\n    try:\n        item = await dashboards.async_create_item(\n            {\n                \"title\": title,\n                \"icon\": \"mdi:car-electric\",\n                \"show_in_sidebar\": True,\n                \"require_admin\": False,\n                \"url_path\": url_path,\n            }\n        )\n    except HomeAssistantError:\n        _LOGGER.exception(\"Could not create the dashboard storage entry\")\n        return None\n\n    dashboard_config = lovelace_dashboard.LovelaceStorage(hass, item)\n    try:\n        await dashboard_config.async_save(\n            {\n                \"strategy\": {\n                    \"type\": AUTO_DASHBOARD_STRATEGY,\n                    \"entry_id\": entry.entry_id,\n                }\n            }\n        )\n        lovelace.dashboards[url_path] = dashboard_config\n        frontend.async_register_built_in_panel(\n            hass,\n            \"lovelace\",\n            frontend_url_path=url_path,\n            require_admin=False,\n            show_in_sidebar=True,\n            sidebar_title=title,\n            sidebar_icon=\"mdi:car-electric\",\n            config={\"mode\": MODE_STORAGE},\n        )\n    except (HomeAssistantError, ValueError):\n        _LOGGER.exception(\"Could not register the dashboard panel\")\n        return None\n\n    await marker_store.async_save({\"handled\": True, \"url_path\": url_path})\n    await async_sync_generated_dashboard_metadata(hass)\n    _LOGGER.info(\"Created dashboard at /%s for %s\", url_path, entry.title)\n    return url_path\n'''
          text = text[:ensure_start] + ensure
          dashboard.write_text(text)

          replace_once(
              "custom_components/e_c3_dashboard/__init__.py",
              "    await async_ensure_dashboard(hass, entry)\n    entry.async_on_unload(entry.add_update_listener(_async_reload_entry))",
              "    coordinator.data[\"dashboard_url_path\"] = await async_ensure_dashboard(hass, entry)\n    # The status sensor is already registered at this point. Publish the actual\n    # package/user-managed dashboard path so compact-card navigation never has\n    # to reconstruct a URL from an e-C3-specific slug.\n    await notifications.async_refresh_entities()\n    entry.async_on_unload(entry.add_update_listener(_async_reload_entry))",
          )

          replace_once(
              "custom_components/e_c3_dashboard/sensor.py",
              '            "vehicle_slug": self.coordinator.data["vehicle_slug"],\n            "vehicle_tracker": self.coordinator.data["vehicle_tracker"],',
              '            "vehicle_slug": self.coordinator.data["vehicle_slug"],\n            "dashboard_url_path": self.coordinator.data.get("dashboard_url_path"),\n            "vehicle_tracker": self.coordinator.data["vehicle_tracker"],',
          )

          card = "custom_components/e_c3_dashboard/static/vehicle-overview-card.js"
          replace_once(
              card,
              '''const dashboardPath = (attributes, override) => {\n  if (override) return override;\n  const slug = String(attributes?.vehicle_slug || \"\").trim();\n  if (!slug) return undefined;\n  const pathSlug = slug\n    .toLowerCase()\n    .replaceAll(\"_\", \"-\")\n    .replace(/[^a-z0-9-]+/g, \"-\")\n    .replace(/^-+|-+$/g, \"\");\n  return pathSlug ? `/e-c3-${pathSlug}/vehicle` : undefined;\n};''',
              '''const dashboardPath = (attributes, override) => {\n  if (override) return override;\n  const path = String(attributes?.dashboard_url_path || \"\")\n    .trim()\n    .replace(/^\\/+|\\/+$/g, \"\");\n  return path ? `/${path}/vehicle` : undefined;\n};''',
          )

          Path("tests/dashboard-naming.test.mjs").write_text('''import assert from "node:assert/strict";\nimport fs from "node:fs";\nimport test from "node:test";\n\nconst dashboardSource = fs.readFileSync(\n  new URL("../custom_components/e_c3_dashboard/dashboard.py", import.meta.url),\n  "utf8",\n);\nconst initSource = fs.readFileSync(\n  new URL("../custom_components/e_c3_dashboard/__init__.py", import.meta.url),\n  "utf8",\n);\nconst sensorSource = fs.readFileSync(\n  new URL("../custom_components/e_c3_dashboard/sensor.py", import.meta.url),\n  "utf8",\n);\nconst configFlowSource = fs.readFileSync(\n  new URL("../custom_components/e_c3_dashboard/config_flow.py", import.meta.url),\n  "utf8",\n);\nconst constSource = fs.readFileSync(\n  new URL("../custom_components/e_c3_dashboard/const.py", import.meta.url),\n  "utf8",\n);\n\ntest("dashboard title is derived from the upstream Stellantis mobile-app brand", () => {\n  assert.match(dashboardSource, /"mycitroen": "Citroën"/);\n  assert.match(dashboardSource, /"mypeugeot": "Peugeot"/);\n  assert.match(dashboardSource, /"myopel": "Opel"/);\n  assert.match(dashboardSource, /"myds": "DS"/);\n  assert.match(dashboardSource, /"myvauxhall": "Vauxhall"/);\n  assert.match(dashboardSource, /return f"\\{brand\\} \\(\\{ordinal\\}\\)"/);\n  assert.match(dashboardSource, /entry\\.options\\.get\\(OPTION_DASHBOARD_NAME/);\n});\n\ntest("new package dashboard URLs are generic brand paths, not e-C3 paths", () => {\n  assert.match(dashboardSource, /return f"\\{brand\\}-dashboard"/);\n  assert.match(dashboardSource, /candidate = f"\\{base\\}-\\{suffix\\}"/);\n  assert.doesNotMatch(dashboardSource, /url_path = slugify\\(f"e-c3-/);\n});\n\ntest("legacy URL migration is package-owned, conflict-safe and copy-before-delete", () => {\n  assert.match(dashboardSource, /current_url_path\\.startswith\\("e-c3-"\\)/);\n  assert.match(dashboardSource, /strategy\\.get\\("entry_id"\\) != entry\\.entry_id/);\n  assert.match(dashboardSource, /frontend\\.async_panel_exists\\(hass, candidate\\)/);\n  assert.match(dashboardSource, /new_item = await dashboards\\.async_create_item/);\n  assert.match(dashboardSource, /await new_dashboard\\.async_save\\(config\\)/);\n  assert.match(dashboardSource, /frontend\\.async_remove_panel\\(hass, current_url_path/);\n  assert.match(dashboardSource, /await dashboards\\.async_delete_item\\(old_item\["id"\]\\)/);\n  assert.match(dashboardSource, /await old_dashboard\\.async_delete\\(\\)/);\n  assert.match(dashboardSource, /"previous_url_path": current_url_path/);\n});\n\ntest("actual dashboard path is published for frontend navigation", () => {\n  assert.match(initSource, /coordinator\\.data\["dashboard_url_path"\] = await async_ensure_dashboard/);\n  assert.match(sensorSource, /"dashboard_url_path": self\\.coordinator\\.data\\.get\\("dashboard_url_path"\\)/);\n  assert.match(dashboardSource, /return await _async_matching_strategy_url_path/);\n});\n\ntest("dashboard display name remains a per-entry option and 0.5.53 cache version", () => {\n  assert.match(configFlowSource, /OPTION_DASHBOARD_NAME/);\n  assert.match(configFlowSource, /normalized\[OPTION_DASHBOARD_NAME\]/);\n  assert.match(constSource, /OPTION_DASHBOARD_NAME = "dashboard_name"/);\n  assert.match(constSource, /FRONTEND_VERSION = "0\\.5\\.53"/);\n});\n''')

          vehicle_test = Path("tests/vehicle-overview-card.test.mjs")
          test_text = vehicle_test.read_text()
          old = '''  assert.doesNotMatch(source, /button\\.vr7/i);\n  assert.match(source, /`\\/e-c3-\\$\\{pathSlug\\}\\/vehicle`/);'''
          new = '''  assert.doesNotMatch(source, /button\\.vr7/i);\n  assert.match(source, /attributes\\?\\.dashboard_url_path/);\n  assert.match(source, /`\\/\\$\\{path\\}\\/vehicle`/);\n  assert.doesNotMatch(source, /`\\/e-c3-\\$\\{/);'''
          if test_text.count(old) != 1:
              raise SystemExit("vehicle-overview-card test URL anchor mismatch")
          vehicle_test.write_text(test_text.replace(old, new, 1))

          production = Path("custom_components/e_c3_dashboard")
          dashboard_text = dashboard.read_text()
          card_text = Path(card).read_text()
          sensor_text = Path("custom_components/e_c3_dashboard/sensor.py").read_text()
          if 'url_path = slugify(f"e-c3-' in dashboard_text:
              raise SystemExit("legacy e-C3 path still used for new dashboard creation")
          if '`/e-c3-${' in card_text:
              raise SystemExit("compact card still reconstructs legacy e-C3 path")
          if 'dashboard_url_path' not in sensor_text:
              raise SystemExit("status sensor does not publish dashboard path")

          Path(".github/workflows/dev-brand-dashboard-url-once.yml").unlink()

      - name: Validate transformed source
        run: |
          python -m compileall -q custom_components/e_c3_dashboard
          for file in custom_components/e_c3_dashboard/static/*.js; do node --check "$file"; done
          node --test tests/*.test.mjs
          git diff --check

      - name: Commit transformed source
        run: |
          git config user.name "CaneTLOTW"
          git config user.email "35076818+CaneTLOTW@users.noreply.github.com"
          git add -A
          git commit -m "dashboard: migrate generated URLs to brand paths"
          git push origin HEAD:develop
