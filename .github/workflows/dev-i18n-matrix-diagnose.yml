name: Dev i18n matrix diagnose

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/dev-i18n-matrix-diagnose.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - name: Run diagnostics
        shell: bash
        run: |
          set +e
          {
            echo '=== EXTRA JS SYNTAX ==='
            for file in custom_components/e_c3_dashboard/static/i18n-extra-*.js; do echo "--- $file"; node --check "$file"; done
            echo '=== TRANSLATION JSON ==='
            python - <<'PY'
          import json
          from pathlib import Path
          langs = ['de','en','fr','it','es','pt','nl','da','nb','sv','fi','pl','cs','sk','hu','ro','sl','hr']
          root = Path('custom_components/e_c3_dashboard/translations')
          def paths(v, p=''):
              out=[]
              for k,c in v.items():
                  q=f'{p}.{k}' if p else k
                  if isinstance(c, dict): out.extend(paths(c,q))
                  else: out.append(q)
              return sorted(out)
          canonical=paths(json.loads((root/'en.json').read_text()))
          for lang in langs:
              try:
                  data=json.loads((root/f'{lang}.json').read_text())
                  keys=paths(data)
                  missing=sorted(set(canonical)-set(keys))
                  extra=sorted(set(keys)-set(canonical))
                  print(lang, 'OK' if not missing and not extra else 'MISMATCH', 'missing=', missing, 'extra=', extra)
              except Exception as exc:
                  print(lang, 'ERROR', repr(exc))
          PY
          } > i18n-diagnostics.txt 2>&1
          cat i18n-diagnostics.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: i18n-matrix-diagnostics
          path: i18n-diagnostics.txt
          retention-days: 1
