name: Dev translation CI cleanup

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/dev-generate-i18n-v10.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Remove temporary development workflows
        run: |
          find .github/workflows -maxdepth 1 -type f -name 'dev-*.yml' -print -delete
          test -f .github/workflows/validate.yaml
          test "$(find .github/workflows -maxdepth 1 -type f | wc -l)" -eq 1
          git diff --check
      - name: Commit cleanup
        run: |
          git config user.name "CaneTLOTW"
          git config user.email "35076818+CaneTLOTW@users.noreply.github.com"
          git add -A .github/workflows
          git commit -m "ci: remove temporary translation workflows"
          git push origin HEAD:develop
