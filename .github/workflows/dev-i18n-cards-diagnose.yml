name: Dev i18n cards diagnose

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/dev-i18n-cards-diagnose.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Reapply pending transformation in workspace
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/dev-i18n-cards-once.yml').read_text()
          start_marker = '      - name: Localize bundled custom cards\n        shell: python\n        run: |\n'
          end_marker = '\n      - name: Validate transformed source\n'
          if source.count(start_marker) != 1 or source.count(end_marker) != 1:
              raise SystemExit('Could not locate one-shot transform body')
          body = source.split(start_marker, 1)[1].split(end_marker, 1)[0]
          body = textwrap.dedent(body)
          exec(compile(body, '<pending-i18n-transform>', 'exec'), {'__name__': '__main__'})

      - name: Capture validation diagnostics
        shell: bash
        run: |
          set +e
          : > diagnostics.txt
          echo '=== compileall ===' >> diagnostics.txt
          python -m compileall -q custom_components/e_c3_dashboard >> diagnostics.txt 2>&1
          echo "exit=$?" >> diagnostics.txt
          echo '=== node --check ===' >> diagnostics.txt
          for file in custom_components/e_c3_dashboard/static/*.js; do
            echo "--- $file" >> diagnostics.txt
            node --check "$file" >> diagnostics.txt 2>&1
            echo "exit=$?" >> diagnostics.txt
          done
          echo '=== node tests ===' >> diagnostics.txt
          node --test tests/*.test.mjs >> diagnostics.txt 2>&1
          echo "exit=$?" >> diagnostics.txt
          echo '=== git diff --check ===' >> diagnostics.txt
          git diff --check >> diagnostics.txt 2>&1
          echo "exit=$?" >> diagnostics.txt
          cat diagnostics.txt
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: i18n-card-diagnostics
          path: diagnostics.txt
          retention-days: 1
