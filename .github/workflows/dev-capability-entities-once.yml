name: Dev capability-gated entities once

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/dev-capability-entities-once.yml

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Apply capability entity gates
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "custom_components/e_c3_dashboard/sensor.py",
              "    entities = [\n        status,\n        Ec3ServerTripHistorySensor(coordinator, entry),\n        Ec3ServerGpsHistorySensor(coordinator, entry),\n        Ec3ServerChargeHistorySensor(coordinator, entry),\n        Ec3VehicleInfoSensor(coordinator, entry),\n        Ec3TrailingConsumptionSensor(coordinator, entry),\n        Ec3DistanceSinceChargeSensor(coordinator, entry),\n        Ec3CurrentTripEnergySensor(coordinator, entry),\n        Ec3LastTripResultSensor(coordinator, entry),\n        Ec3CurrentChargePowerSensor(coordinator, entry),\n        Ec3LastChargeResultSensor(coordinator, entry),\n    ]",
              "    capabilities = coordinator.data.get(\"capabilities\", {})\n    electric = capabilities.get(\"electric_trip_metrics\", False)\n    charge_history = capabilities.get(\"charge_history\", False)\n    charging = capabilities.get(\"charging\", False)\n\n    entities = [\n        status,\n        Ec3ServerTripHistorySensor(coordinator, entry),\n        Ec3ServerGpsHistorySensor(coordinator, entry),\n        Ec3VehicleInfoSensor(coordinator, entry),\n        Ec3LastTripResultSensor(coordinator, entry),\n    ]\n    if electric:\n        entities.extend([\n            Ec3TrailingConsumptionSensor(coordinator, entry),\n            Ec3CurrentTripEnergySensor(coordinator, entry),\n        ])\n    if charge_history:\n        entities.extend([\n            Ec3ServerChargeHistorySensor(coordinator, entry),\n            Ec3DistanceSinceChargeSensor(coordinator, entry),\n            Ec3LastChargeResultSensor(coordinator, entry),\n        ])\n    if charging:\n        entities.append(Ec3CurrentChargePowerSensor(coordinator, entry))",
          )

          replace_once(
              "custom_components/e_c3_dashboard/number.py",
              "    entities = [NotificationSettingNumber(coordinator, entry, key) for key in SETTING_META]",
              "    capabilities = coordinator.data.get(\"capabilities\", {})\n    electric = capabilities.get(\"electric_energy\", False)\n    charging = capabilities.get(\"charging\", False)\n    allowed = {\n        \"service_battery_warning\",\n        \"service_battery_reset\",\n        \"stale_home_hours\",\n        \"stale_away_hours\",\n        \"probe_wait_minutes\",\n    }\n    if electric:\n        allowed.update({\n            \"range_warning_km\",\n            \"range_reset_km\",\n            \"home_soc_warning\",\n            \"home_soc_reset\",\n            \"home_delay_minutes\",\n        })\n    if charging:\n        allowed.add(\"charge_start_delay_minutes\")\n    entities = [\n        NotificationSettingNumber(coordinator, entry, key)\n        for key in SETTING_META\n        if key in allowed\n    ]",
          )

          replace_once(
              "custom_components/e_c3_dashboard/switch.py",
              "    entities = [\n        Ec3NotificationSwitch(coordinator, entry, key, _BASE_DETAILS[key])\n        for key in BASE_SWITCHES\n    ]",
              "    capabilities = coordinator.data.get(\"capabilities\", {})\n    allowed_switches = {\n        SWITCH_NOTIFICATIONS,\n        SWITCH_TRIP_REPORTS,\n        SWITCH_ALERTS,\n        SWITCH_WAKEUP_HOURLY,\n        SWITCH_WAKEUP_PROBE,\n    }\n    if capabilities.get(\"charging\", False):\n        allowed_switches.update({SWITCH_CHARGE_REPORTS, SWITCH_WAKEUP_CHARGING})\n    entities = [\n        Ec3NotificationSwitch(coordinator, entry, key, _BASE_DETAILS[key])\n        for key in BASE_SWITCHES\n        if key in allowed_switches\n    ]",
          )

          test = Path("tests/vehicle-capabilities.test.mjs")
          text = test.read_text()
          import_anchor = 'const metrics = fs.readFileSync(new URL("../custom_components/e_c3_dashboard/metrics.py", import.meta.url), "utf8");\n'
          extra = 'const sensorPlatform = fs.readFileSync(new URL("../custom_components/e_c3_dashboard/sensor.py", import.meta.url), "utf8");\nconst numberPlatform = fs.readFileSync(new URL("../custom_components/e_c3_dashboard/number.py", import.meta.url), "utf8");\nconst switchPlatform = fs.readFileSync(new URL("../custom_components/e_c3_dashboard/switch.py", import.meta.url), "utf8");\n'
          if text.count(import_anchor) != 1:
              raise SystemExit("capability test import anchor mismatch")
          text = text.replace(import_anchor, import_anchor + extra, 1)
          append = '''\n\ntest("package-owned entity platforms do not load EV-only entities for Thermic", () => {\n  assert.match(sensorPlatform, /if electric:/);\n  assert.match(sensorPlatform, /if charge_history:/);\n  assert.match(sensorPlatform, /if charging:/);\n  assert.match(numberPlatform, /if electric:/);\n  assert.match(numberPlatform, /if charging:/);\n  assert.match(switchPlatform, /if capabilities\\.get\\("charging", False\\):/);\n  assert.match(switchPlatform, /allowed_switches/);\n});\n'''
          test.write_text(text + append)

          Path(".github/workflows/dev-capability-entities-once.yml").unlink()
      - name: Validate capability-gated entity platforms
        run: |
          python -m compileall -q custom_components/e_c3_dashboard
          for file in custom_components/e_c3_dashboard/static/*.js; do node --check "$file"; done
          node --test tests/*.test.mjs
          git diff --check
      - name: Commit capability-gated entity platforms
        run: |
          git config user.name "CaneTLOTW"
          git config user.email "35076818+CaneTLOTW@users.noreply.github.com"
          git add -A
          git commit -m "vehicle: gate generated entities by capability"
          git push origin HEAD:develop
