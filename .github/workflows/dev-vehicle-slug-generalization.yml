name: Dev vehicle slug generalization

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/dev-vehicle-slug-generalization.yml

permissions:
  contents: write

jobs:
  generalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Apply vehicle slug generalization
        run: python .github/scripts/dev_vehicle_slug_generalization.py

      - name: Remove temporary wrappers
        run: |
          rm -f .github/scripts/dev_vehicle_slug_generalization.py
          rm -f .github/workflows/dev-vehicle-slug-generalization.yml

      - name: Validate transformed source
        run: |
          python -m compileall -q custom_components/e_c3_dashboard
          for file in custom_components/e_c3_dashboard/static/*.js; do node --check "$file"; done
          node --test tests/*.test.mjs
          git diff --check

      - name: Commit transformed source
        run: |
          git config user.name "CaneTLOTW"
          git config user.email "35076818+CaneTLOTW@users.noreply.github.com"
          git add -A
          git commit -m "config: generalize vehicle storage slugs"
          git push origin HEAD:develop
