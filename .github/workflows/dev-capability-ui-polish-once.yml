name: Dev capability UI polish once

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/dev-capability-ui-polish-once.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Apply capability-specific notification and system UI gates
        shell: python
        run: |
          from pathlib import Path

          path = Path('custom_components/e_c3_dashboard/static/e_c3_dashboard.js')
          text = path.read_text()
          replacements = [
              ('        ["range_warning_km", strings.rangeWarning, "mdi:map-marker-distance"],', '        supportsElectric ? ["range_warning_km", strings.rangeWarning, "mdi:map-marker-distance"] : null,'),
              ('        ["range_reset_km", strings.rangeReset, "mdi:map-marker-check"],', '        supportsElectric ? ["range_reset_km", strings.rangeReset, "mdi:map-marker-check"] : null,'),
              ('        ["home_soc_warning", strings.homeSocWarning, "mdi:battery-alert"],', '        supportsElectric ? ["home_soc_warning", strings.homeSocWarning, "mdi:battery-alert"] : null,'),
              ('        ["home_soc_reset", strings.homeSocReset, "mdi:battery-check"],', '        supportsElectric ? ["home_soc_reset", strings.homeSocReset, "mdi:battery-check"] : null,'),
              ('        ["home_delay_minutes", strings.homeWarningDelay, "mdi:timer-outline"],', '        supportsElectric ? ["home_delay_minutes", strings.homeWarningDelay, "mdi:timer-outline"] : null,'),
              ('        ["charge_start_delay_minutes", strings.chargeStartDelay, "mdi:timer-play-outline"],', '        supportsCharging ? ["charge_start_delay_minutes", strings.chargeStartDelay, "mdi:timer-play-outline"] : null,'),
              ('      ]);\n      const timingAvailability', '      ].filter(Boolean));\n      const timingAvailability'),
              ('      ]);\n      const quietHours', '      ].filter(Boolean));\n      const quietHours'),
              ('        entity("battery_values_correction") ? { type: "custom:bubble-card", card_type: "button", button_type: "switch", entity: entity("battery_values_correction"), name: strings.correctBatteryValues, icon: "mdi:auto-fix", show_state: true, force_icon: true } : null,', '        supportsElectric && entity("battery_values_correction") ? { type: "custom:bubble-card", card_type: "button", button_type: "switch", entity: entity("battery_values_correction"), name: strings.correctBatteryValues, icon: "mdi:auto-fix", show_state: true, force_icon: true } : null,'),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one strategy anchor, found {count}: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          Path('.github/workflows/dev-capability-ui-polish-once.yml').unlink()
      - name: Validate
        run: |
          python -m compileall -q custom_components/e_c3_dashboard
          for file in custom_components/e_c3_dashboard/static/*.js; do node --check "$file"; done
          node --test tests/*.test.mjs
          git diff --check
      - name: Commit
        run: |
          git config user.name "CaneTLOTW"
          git config user.email "35076818+CaneTLOTW@users.noreply.github.com"
          git add -A
          git commit -m "vehicle: hide irrelevant thermic controls"
          git push origin HEAD:develop
