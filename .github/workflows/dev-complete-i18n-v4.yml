name: Dev complete language matrix v4

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/dev-complete-i18n-v4.yml

permissions:
  contents: write

jobs:
  translate:
    name: Translate ${{ matrix.language }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        language: [it, es, pt, nl, da, nb, sv, fi, pl, cs, sk, hu, ro, sl, hr]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - name: Export canonical frontend catalog
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { FRONTEND_TEXT } from './custom_components/e_c3_dashboard/static/i18n.js';
          import { EXTRA_FRONTEND_TEXT as west } from './custom_components/e_c3_dashboard/static/i18n-extra-west.js';
          import { EXTRA_FRONTEND_TEXT as north } from './custom_components/e_c3_dashboard/static/i18n-extra-north.js';
          import { EXTRA_FRONTEND_TEXT as east } from './custom_components/e_c3_dashboard/static/i18n-extra-east.js';
          fs.writeFileSync('/tmp/frontend-i18n-source.json', JSON.stringify({ canonical: {
            tripHistory: FRONTEND_TEXT.tripHistory.en,
            chargeHistory: FRONTEND_TEXT.chargeHistory.en,
            vehicleOverview: FRONTEND_TEXT.vehicleOverview.en,
            dashboard: FRONTEND_TEXT.dashboard.en,
          }, extras: Object.assign({}, west, north, east) }));
          JS
      - name: Translate missing frontend and server strings
        env:
          LANG_CODE: ${{ matrix.language }}
          PYTHONUNBUFFERED: "1"
        run: |
          python <<'PY'
          from __future__ import annotations
          import ast
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path
          from string import Formatter

          ROOT = Path('custom_components/e_c3_dashboard')
          lang = os.environ['LANG_CODE']
          target = 'no' if lang == 'nb' else lang
          protected_terms = sorted([
              'e-C3 Dashboard', 'Home Assistant', 'Stellantis Vehicles', 'Stellantis',
              'Recorder', 'HACS', 'ABRP', 'Notify', 'SOC', 'AC', 'DC', 'VIN',
          ], key=len, reverse=True)
          protected = re.compile('(' + '|'.join([
              r'\{[^{}]+\}', *(re.escape(term) for term in protected_terms),
              r'\*\*', r'###', r'##', r'`', r'\n',
          ]) + ')')
          cache: dict[str, str] = {}

          def placeholders(value: str) -> list[str]:
              return sorted(
                  field for _literal, field, _spec, _conversion in Formatter().parse(value)
                  if field is not None
              )

          def translate_plain(value: str) -> str:
              if not value or not value.strip():
                  return value
              if value in cache:
                  return cache[value]
              payload = urllib.parse.urlencode({
                  'client': 'gtx', 'sl': 'en', 'tl': target, 'dt': 't', 'q': value,
              }).encode()
              error = None
              for attempt in range(9):
                  request = urllib.request.Request(
                      'https://translate.googleapis.com/translate_a/single',
                      data=payload,
                      headers={'User-Agent': 'Mozilla/5.0 e-c3-dashboard-i18n/0.5.54'},
                      method='POST',
                  )
                  try:
                      with urllib.request.urlopen(request, timeout=30) as response:
                          data = json.loads(response.read().decode('utf-8'))
                      result = ''.join(part[0] for part in data[0] if part and part[0])
                      cache[value] = result
                      time.sleep(0.12)
                      return result
                  except urllib.error.HTTPError as exc:
                      error = exc
                      if exc.code == 429:
                          time.sleep(min(45, 5 + attempt * 5))
                      else:
                          time.sleep(min(16, 2 ** attempt))
                  except Exception as exc:
                      error = exc
                      time.sleep(min(16, 2 ** attempt))
              raise RuntimeError(f'{lang}: translation failed after retries: {error}')

          def translate_value(value: str) -> str:
              pieces = protected.split(value)
              result = ''.join(
                  piece if protected.fullmatch(piece or '') else translate_plain(piece)
                  for piece in pieces
              )
              if placeholders(result) != placeholders(value):
                  raise RuntimeError(f'{lang}: placeholder mismatch: {value!r} -> {result!r}')
              for term in protected_terms:
                  if result.count(term) != value.count(term):
                      raise RuntimeError(f'{lang}: protected term changed: {term}: {value!r} -> {result!r}')
              for token in ['**', '###', '##', '`', '\n']:
                  if result.count(token) != value.count(token):
                      raise RuntimeError(f'{lang}: protected syntax changed: {token!r}: {value!r} -> {result!r}')
              return result

          source = json.loads(Path('/tmp/frontend-i18n-source.json').read_text())
          frontend: dict[str, dict[str, str]] = {}
          for namespace in ['tripHistory','chargeHistory','vehicleOverview','dashboard']:
              current = source['extras'].get(lang, {}).get(namespace, {})
              missing = {
                  key: translate_value(english)
                  for key, english in source['canonical'][namespace].items()
                  if key not in current
              }
              if missing:
                  frontend[namespace] = missing

          tree = ast.parse((ROOT / 'i18n.py').read_text())
          base = None
          for node in tree.body:
              if isinstance(node, ast.AnnAssign) and isinstance(node.target, ast.Name) and node.target.id == '_MESSAGES':
                  base = ast.literal_eval(node.value)
                  break
          if not base:
              raise RuntimeError('could not parse server message catalog')
          server = {key: translate_value(value) for key, value in base['en'].items()}

          out = {'language': lang, 'frontend': frontend, 'server': server}
          path = Path(f'/tmp/translation-{lang}.json')
          path.write_text(json.dumps(out, ensure_ascii=False, indent=2) + '\n')
          print(f'{lang}: {sum(len(v) for v in frontend.values())} frontend completions, {len(server)} server strings, {len(cache)} translation calls')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: translation-${{ matrix.language }}
          path: /tmp/translation-${{ matrix.language }}.json
          retention-days: 1

  aggregate:
    name: Aggregate and validate translations
    needs: translate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: translation-*
          path: /tmp/generated
          merge-multiple: true
      - name: Build strict translation assets
        run: |
          python <<'PY'
          import json
          from pathlib import Path

          expected = ['it','es','pt','nl','da','nb','sv','fi','pl','cs','sk','hu','ro','sl','hr']
          generated = {}
          for path in Path('/tmp/generated').glob('translation-*.json'):
              data = json.loads(path.read_text())
              generated[data['language']] = data
          if sorted(generated) != sorted(expected):
              raise SystemExit(f'missing generated languages: {sorted(set(expected)-set(generated))}')

          root = Path('custom_components/e_c3_dashboard')
          completions = {lang: generated[lang]['frontend'] for lang in expected}
          (root/'static/i18n-extra-completions.js').write_text(
              '/* Machine-generated completion for supported frontend locales.\n'
              ' * Existing human-reviewed translations are retained; this file contains only previously missing keys.\n'
              ' */\nexport const FRONTEND_COMPLETIONS = '
              + json.dumps(completions, ensure_ascii=False, indent=2)
              + ';\n'
          )
          server = {lang: generated[lang]['server'] for lang in expected}
          (root/'server_translations.json').write_text(json.dumps(server, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Wire strict frontend and backend locale resolvers
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          root = Path('custom_components/e_c3_dashboard')
          p = root/'static/i18n.js'
          text = p.read_text()
          anchor = 'import { EXTRA_FRONTEND_TEXT as EASTERN_TEXT } from "./i18n-extra-east.js?v=0.5.54";\n'
          completion_import = 'import { FRONTEND_COMPLETIONS } from "./i18n-extra-completions.js?v=0.5.54";\n'
          if anchor not in text:
              raise SystemExit('frontend import anchor missing')
          text = text.replace(anchor, anchor + completion_import, 1)
          old = '      FRONTEND_TEXT[namespace][language] = { ...FRONTEND_TEXT[namespace].en, ...translated };'
          new = '''      FRONTEND_TEXT[namespace][language] = {\n        ...translated,\n        ...(FRONTEND_COMPLETIONS[language]?.[namespace] || {}),\n      };'''
          if old not in text:
              raise SystemExit('English namespace fallback anchor missing')
          text = text.replace(old, new, 1)
          old = '''for (const [language, [fuel, fuelRange, fuelConsumption]] of Object.entries(CAPABILITY_LABELS)) {\n  FRONTEND_TEXT.vehicleOverview[language] = { ...FRONTEND_TEXT.vehicleOverview.en, ...FRONTEND_TEXT.vehicleOverview[language], fuel };\n  FRONTEND_TEXT.dashboard[language] = { ...FRONTEND_TEXT.dashboard.en, ...FRONTEND_TEXT.dashboard[language], fuel, fuelRange, fuelConsumption };\n}\n'''
          new = '''for (const [language, [fuel, fuelRange, fuelConsumption]] of Object.entries(CAPABILITY_LABELS)) {\n  FRONTEND_TEXT.vehicleOverview[language] = { ...FRONTEND_TEXT.vehicleOverview[language], fuel };\n  FRONTEND_TEXT.dashboard[language] = { ...FRONTEND_TEXT.dashboard[language], fuel, fuelRange, fuelConsumption };\n}\n\nfor (const language of SUPPORTED_LANGUAGES) {\n  for (const namespace of ["tripHistory", "chargeHistory", "vehicleOverview", "dashboard"]) {\n    const canonicalKeys = Object.keys(FRONTEND_TEXT[namespace].en).sort();\n    const translatedKeys = Object.keys(FRONTEND_TEXT[namespace][language] || {}).sort();\n    if (canonicalKeys.length !== translatedKeys.length || canonicalKeys.some((key, index) => key !== translatedKeys[index])) {\n      throw new Error(`Incomplete e-C3 Dashboard frontend translation: ${language}/${namespace}`);\n    }\n  }\n}\n'''
          if old not in text:
              raise SystemExit('capability language overlay anchor missing')
          text = text.replace(old, new, 1)
          p.write_text(text)

          for name in ['i18n-extra-west.js','i18n-extra-north.js','i18n-extra-east.js']:
              q = root/'static'/name
              q.write_text(q.read_text().replace(
                  ' * Missing keys deliberately inherit the canonical English catalog in i18n.js.\n',
                  ' * Human-reviewed and previously supplied translations; missing keys are completed explicitly in i18n-extra-completions.js.\n',
              ))

          p = root/'__init__.py'
          text = p.read_text()
          anchor = '        "i18n-extra-east.js",\n'
          if anchor not in text:
              raise SystemExit('static route anchor missing')
          text = text.replace(anchor, anchor + '        "i18n-extra-completions.js",\n', 1)
          p.write_text(text)

          p = root/'i18n.py'
          text = p.read_text().replace(
              'from __future__ import annotations\n\nfrom typing import Any\n',
              'from __future__ import annotations\n\nimport json\nfrom pathlib import Path\nfrom typing import Any\n',
              1,
          )
          insert = '''_SUPPORTED_LANGUAGES = {\n    "de", "en", "fr", "it", "es", "pt", "nl", "da", "nb", "sv", "fi",\n    "pl", "cs", "sk", "hu", "ro", "sl", "hr",\n}\n_EXTRA_MESSAGES = json.loads(\n    Path(__file__).with_name("server_translations.json").read_text(encoding="utf-8")\n)\n_MESSAGES.update(_EXTRA_MESSAGES)\n_CANONICAL_MESSAGE_KEYS = set(_MESSAGES["en"])\nfor _language in _SUPPORTED_LANGUAGES:\n    if set(_MESSAGES.get(_language, {})) != _CANONICAL_MESSAGE_KEYS:\n        raise RuntimeError(f"Incomplete e-C3 Dashboard server translation: {_language}")\n\n\n'''
          marker = '\n\ndef language_for(hass: HomeAssistant) -> str:\n'
          if marker not in text:
              raise SystemExit('server resolver anchor missing')
          text = text.replace(marker, '\n\n' + insert + 'def language_for(hass: HomeAssistant) -> str:\n', 1)
          old = '''def language_for(hass: HomeAssistant) -> str:\n    """Return the supported language selected for this HA instance."""\n    requested = str(hass.config.language or "en").lower()\n    if requested.startswith("de"):\n        return "de"\n    if requested.startswith("fr"):\n        return "fr"\n    return "en"\n'''
          new = '''def language_for(hass: HomeAssistant) -> str:\n    """Return the normalized supported language selected for this HA instance."""\n    requested = str(hass.config.language or "en").strip().lower().replace("_", "-")\n    base = requested.split("-", 1)[0]\n    if base == "no":\n        base = "nb"\n    return base if base in _SUPPORTED_LANGUAGES else "en"\n'''
          if old not in text:
              raise SystemExit('old server resolver missing')
          p.write_text(text.replace(old, new, 1))

          # Persistent regression tests for the completed runtime catalogs.
          Path('tests/frontend-language-parity.test.mjs').write_text('''import assert from "node:assert/strict";\nimport test from "node:test";\nimport { FRONTEND_TEXT } from "../custom_components/e_c3_dashboard/static/i18n.js";\n\nconst languages = ["de","en","fr","it","es","pt","nl","da","nb","sv","fi","pl","cs","sk","hu","ro","sl","hr"];\nconst namespaces = ["tripHistory","chargeHistory","vehicleOverview","dashboard"];\n\ntest("every supported frontend locale has exact canonical key parity", () => {\n  for (const namespace of namespaces) {\n    const canonical = Object.keys(FRONTEND_TEXT[namespace].en).sort();\n    for (const language of languages) {\n      assert.deepEqual(Object.keys(FRONTEND_TEXT[namespace][language] || {}).sort(), canonical, `${language}/${namespace}`);\n      for (const key of canonical) assert.ok(String(FRONTEND_TEXT[namespace][language][key] || "").trim(), `${language}/${namespace}/${key}`);\n    }\n  }\n});\n''')

          Path('tests/server-i18n.test.mjs').write_text('''import assert from "node:assert/strict";\nimport fs from "node:fs";\nimport test from "node:test";\n\nconst root = new URL("../custom_components/e_c3_dashboard/", import.meta.url);\nconst source = fs.readFileSync(new URL("i18n.py", root), "utf8");\nconst catalogs = JSON.parse(fs.readFileSync(new URL("server_translations.json", root), "utf8"));\nconst languages = ["it","es","pt","nl","da","nb","sv","fi","pl","cs","sk","hu","ro","sl","hr"];\nconst expected = ["manual_wakeup","test_title","test_message","trip_title","trip_message","trip_message_electric","charge_completed_title","charge_completed_message","range_low_title","range_low_message","charge_recommended_title","charge_recommended_message","service_battery_low_title","service_battery_low_message","availability_restored_title","availability_restored_message","availability_restored_message_electric","availability_probe","availability_outage_title","availability_outage_message","charge_started_title","charge_started_message","wakeup_charging","wakeup_hourly","today_at","tomorrow_at","unknown"].sort();\n\ntest("all additional server locales have exact message-key parity", () => {\n  for (const language of languages) assert.deepEqual(Object.keys(catalogs[language] || {}).sort(), expected, language);\n});\n\ntest("server locale resolver covers regional locales and fails closed on incomplete catalogs", () => {\n  assert.match(source, /_SUPPORTED_LANGUAGES/);\n  assert.match(source, /if base == "no":/);\n  assert.match(source, /base = "nb"/);\n  assert.match(source, /Incomplete e-C3 Dashboard server translation/);\n});\n''')

          p = Path('tests/language-matrix.test.mjs')
          text = p.read_text()
          text = re.sub(
              r'test\("all fifteen additional frontend languages provide every user-facing namespace", \(\) => \{.*?\n\}\);',
              '''test("additional frontend languages no longer use implicit English namespace fill", () => {\n  const source = fs.readFileSync(new URL("static/i18n.js", root), "utf8");\n  assert.doesNotMatch(source, /\.\.\.FRONTEND_TEXT\[namespace\]\.en/);\n  assert.match(source, /FRONTEND_COMPLETIONS/);\n  assert.match(source, /Incomplete e-C3 Dashboard frontend translation/);\n});''',
              text,
              count=1,
              flags=re.S,
          )
          p.write_text(text)

          # Normal Validate must syntax-check every package JS file and verify the
          # generated server catalog as JSON.
          p = Path('.github/workflows/validate.yaml')
          text = p.read_text()
          old = '''      - name: Check frontend JavaScript\n        run: |\n          node --check custom_components/e_c3_dashboard/static/frontend.js\n          node --check custom_components/e_c3_dashboard/static/i18n.js\n          node --check custom_components/e_c3_dashboard/static/e_c3_dashboard.js\n          node --check custom_components/e_c3_dashboard/static/vehicle-overview-card.js\n          node --check custom_components/e_c3_dashboard/static/gps-history-card.js\n          node --check custom_components/e_c3_dashboard/static/gps-history-core.js\n          node --check custom_components/e_c3_dashboard/static/trip-history-card.js\n          node --check custom_components/e_c3_dashboard/static/charge-history-card.js\n          node --check custom_components/e_c3_dashboard/static/charge-history-core.js\n'''
          new = '''      - name: Check frontend JavaScript\n        run: |\n          for file in custom_components/e_c3_dashboard/static/*.js; do node --check "$file"; done\n'''
          if old not in text:
              raise SystemExit('Validate JS block missing')
          text = text.replace(old, new, 1)
          text = text.replace(
              '          python3 -m json.tool custom_components/e_c3_dashboard/manifest.json >/dev/null\n',
              '          python3 -m json.tool custom_components/e_c3_dashboard/manifest.json >/dev/null\n          python3 -m json.tool custom_components/e_c3_dashboard/server_translations.json >/dev/null\n',
              1,
          )
          p.write_text(text)

          # All temporary one-shot workflows disappear in the resulting product
          # commit. validate.yaml remains the only workflow.
          for name in [
              'dev-audit-housekeeping.yml','dev-housekeeping-core.yml','dev-complete-i18n.yml',
              'dev-complete-i18n-v2.yml','dev-complete-i18n-v3.yml','dev-complete-i18n-v4.yml',
          ]:
              q = Path('.github/workflows')/name
              if q.exists(): q.unlink()
          PY
      - name: Strict final language and source audit
        run: |
          python -m compileall -q custom_components/e_c3_dashboard
          for file in custom_components/e_c3_dashboard/static/*.js; do node --check "$file"; done
          node --test tests/*.test.mjs
          python -m json.tool custom_components/e_c3_dashboard/server_translations.json >/dev/null
          python <<'PY'
          import ast, json
          from pathlib import Path
          root=Path('custom_components/e_c3_dashboard')
          base=None
          for node in ast.parse((root/'i18n.py').read_text()).body:
              if isinstance(node, ast.AnnAssign) and isinstance(node.target, ast.Name) and node.target.id == '_MESSAGES':
                  base=ast.literal_eval(node.value)
          extra=json.loads((root/'server_translations.json').read_text())
          canonical=set(base['en'])
          assert set(base['de']) == canonical == set(base['fr'])
          assert all(set(data) == canonical for data in extra.values())
          PY
          test "$(find .github/workflows -maxdepth 1 -type f -printf '%f\n')" = "validate.yaml"
          ! grep -R "\.\.\.FRONTEND_TEXT\[namespace\]\.en" custom_components/e_c3_dashboard/static/i18n.js
          ! grep -R "_async_migrate_generated_dashboard_url" custom_components/e_c3_dashboard/dashboard.py
          git diff --check
      - name: Commit completed language matrix and housekeeping
        run: |
          git config user.name "CaneTLOTW"
          git config user.email "35076818+CaneTLOTW@users.noreply.github.com"
          git add -A
          git commit -m "i18n: complete language matrix and housekeeping"
          git push origin HEAD:develop
