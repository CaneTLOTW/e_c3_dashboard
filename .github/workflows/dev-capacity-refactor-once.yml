name: Dev capacity refactor once

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/dev-capacity-refactor-once.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Apply guarded capacity refactor
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one anchor, found {count}: {old[:80]!r}")
              file.write_text(text.replace(old, new, 1))

          def replace_all(path, old, new, expected):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} anchors, found {count}: {old!r}")
              file.write_text(text.replace(old, new))

          server = "custom_components/e_c3_dashboard/server_history.py"
          replace_once(server, "_CURVE_STORE_VERSION = 1\n_FALLBACK_CAPACITY_KWH = 43.4\n_MIN_TRIP_DISTANCE_KM = 1.0", "_CURVE_STORE_VERSION = 1\n_MIN_TRIP_DISTANCE_KM = 1.0")
          replace_once(
              server,
              "def _capacity(value: Any) -> float:\n    capacity = _number(value)\n    return round(capacity, 2) if capacity is not None and capacity > 0 else _FALLBACK_CAPACITY_KWH",
              "def _capacity(value: Any) -> float | None:\n    capacity = _number(value)\n    return round(capacity, 2) if capacity is not None and capacity > 0 else None",
          )
          replace_once(
              server,
              "    if energy_kwh is None and not no_reliable_soc_energy:\n        energy_kwh = round((start_soc - end_soc) * capacity / 100, 3)",
              "    if energy_kwh is None and not no_reliable_soc_energy and capacity is not None:\n        energy_kwh = round((start_soc - end_soc) * capacity / 100, 3)",
          )
          replace_once(
              server,
              "        capacity = _capacity(following.get(\"capacity_kwh\") or previous.get(\"capacity_kwh\"))\n        energy = round(delta_soc * capacity / 100, 3)",
              "        capacity = _capacity(following.get(\"capacity_kwh\") or previous.get(\"capacity_kwh\"))\n        energy = round(delta_soc * capacity / 100, 3) if capacity is not None else None",
          )
          replace_once(
              server,
              "    def _capacity_for_trip(self, raw: dict[str, Any]) -> float:",
              "    def _capacity_for_trip(self, raw: dict[str, Any]) -> float | None:",
          )
          replace_once(
              server,
              "        if current and _number(current.state) is not None:\n            return _capacity(current.state)\n        return _capacity(None)",
              "        if current and _number(current.state) is not None:\n            return _capacity(current.state)\n        if self.metrics:\n            resolved, _source = self.metrics.battery_capacity()\n            return _capacity(resolved)\n        return None",
          )
          replace_once(
              server,
              "            session_capacity = _capacity(self._number_at(capacity, begin))\n            duration = max(1, round((finish - begin).total_seconds()))\n            energy = round(max(0, end_soc - start_soc) * session_capacity / 100, 3)",
              "            session_capacity = _capacity(self._number_at(capacity, begin))\n            if session_capacity is None and self.metrics:\n                session_capacity, _source = self.metrics.battery_capacity()\n            duration = max(1, round((finish - begin).total_seconds()))\n            energy = (\n                round(max(0, end_soc - start_soc) * session_capacity / 100, 3)\n                if session_capacity is not None\n                else None\n            )",
          )
          replace_once(
              server,
              "            average_power = round(energy / (duration / 3600), 2)",
              "            average_power = (\n                round(energy / (duration / 3600), 2) if energy is not None else None\n            )",
          )

          notifications = "custom_components/e_c3_dashboard/notifications.py"
          replace_once(
              notifications,
              "        soc = self._state_number(\"battery\")\n        capacity = self._as_float(active.get(\"capacity_kwh\")) or 43.4\n        power = self._recent_charge_power(active)",
              "        soc = self._state_number(\"battery\")\n        capacity = self._as_float(active.get(\"capacity_kwh\"))\n        if capacity is None:\n            capacity, _source = self.metrics.battery_capacity()\n        power = self._recent_charge_power(active)",
          )
          replace_once(
              notifications,
              "                if soc is not None and power and target > soc\n                else None",
              "                if soc is not None and capacity is not None and power and target > soc\n                else None",
          )

          strategy = "custom_components/e_c3_dashboard/static/e_c3_dashboard.js"
          replace_all(strategy, "fallback_capacity_kwh: 43.4", "fallback_capacity_kwh: null", 3)

          card = "custom_components/e_c3_dashboard/static/charge-history-card.js"
          replace_once(
              card,
              "function deriveServerChargeDisplay(charge, fallbackCapacity = 43.4) {\n    const observed = charge.quality === \"observed\";\n    const capacity = Number(charge.capacity_kwh) > 0 ? Number(charge.capacity_kwh) : Number(fallbackCapacity);",
              "function deriveServerChargeDisplay(charge, fallbackCapacity = null) {\n    const observed = charge.quality === \"observed\";\n    const configuredFallback = Number(fallbackCapacity);\n    const capacity = Number(charge.capacity_kwh) > 0\n        ? Number(charge.capacity_kwh)\n        : Number.isFinite(configuredFallback) && configuredFallback > 0\n            ? configuredFallback\n            : null;",
          )
          replace_all(card, "fallback_capacity_kwh: 43.4", "fallback_capacity_kwh: null", 3)
          replace_all(
              card,
              "                fallbackCapacity: Number(this._config.fallback_capacity_kwh),",
              "                fallbackCapacity: this._config.fallback_capacity_kwh,",
              2,
          )
          replace_once(
              card,
              "        const capacity = Number.isFinite(resultCapacity) && resultCapacity > 0 && !active\n            ? resultCapacity\n            : Number.isFinite(measuredCapacity) && measuredCapacity > 0\n                ? measuredCapacity\n                : Number(this._config.fallback_capacity_kwh);",
              "        const configuredFallback = Number(this._config.fallback_capacity_kwh);\n        const capacity = Number.isFinite(resultCapacity) && resultCapacity > 0 && !active\n            ? resultCapacity\n            : Number.isFinite(measuredCapacity) && measuredCapacity > 0\n                ? measuredCapacity\n                : Number.isFinite(configuredFallback) && configuredFallback > 0\n                    ? configuredFallback\n                    : null;",
          )
          replace_once(
              card,
              "        const energy = Number.isFinite(Number(startSoc)) && Number.isFinite(Number(endSoc))\n            ? Math.max(0, (endSoc - startSoc) * curve.capacity / 100)\n            : null;",
              "        const energy = Number.isFinite(Number(startSoc)) && Number.isFinite(Number(endSoc))\n            && Number.isFinite(Number(curve?.capacity)) && Number(curve.capacity) > 0\n            ? Math.max(0, (endSoc - startSoc) * curve.capacity / 100)\n            : null;",
          )

          production = Path("custom_components/e_c3_dashboard")
          offenders = []
          for file in production.rglob("*"):
              if file.is_file() and file.suffix in {".py", ".js", ".json"}:
                  if "43.4" in file.read_text(errors="ignore"):
                      offenders.append(str(file))
          if offenders:
              raise SystemExit(f"Fixed 43.4 kWh fallback remains in production files: {offenders}")

      - name: Validate transformed source
        run: |
          python -m compileall -q custom_components/e_c3_dashboard
          for file in custom_components/e_c3_dashboard/static/*.js; do node --check "$file"; done
          node --test tests/*.test.mjs
          git diff --check

      - name: Commit transformed source
        run: |
          git config user.name "CaneTLOTW"
          git config user.email "35076818+CaneTLOTW@users.noreply.github.com"
          git add custom_components/e_c3_dashboard
          git commit -m "data: remove fixed battery capacity fallbacks"
          git push origin HEAD:develop
