name: Dev finalize 18-language support

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/dev-i18n-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Finalize resolver and tests
        run: |
          python <<'PY'
          from pathlib import Path

          p=Path('custom_components/e_c3_dashboard/static/i18n.js')
          text=p.read_text()
          marker='export const FRONTEND_TEXT = {'
          imports='''import { EXTRA_FRONTEND_TEXT as WESTERN_TEXT } from "./i18n-extra-west.js?v=0.5.53";\nimport { EXTRA_FRONTEND_TEXT as NORTHERN_TEXT } from "./i18n-extra-north.js?v=0.5.53";\nimport { EXTRA_FRONTEND_TEXT as EASTERN_TEXT } from "./i18n-extra-east.js?v=0.5.53";\n\n'''
          if imports not in text:
              text=text.replace(marker,imports+marker,1)
          start=text.index('export function languageFor(context) {')
          textfor=text.index('export function textFor(context, namespace) {',start)
          resolver='''const SUPPORTED_LANGUAGES = new Set([\n  "de", "en", "fr", "it", "es", "pt", "nl", "da", "nb", "sv", "fi", "pl", "cs", "sk", "hu", "ro", "sl", "hr",\n]);\nconst LOCALE_BY_LANGUAGE = {\n  de: "de-DE", en: "en-US", fr: "fr-FR", it: "it-IT", es: "es-ES", pt: "pt-PT", nl: "nl-NL", da: "da-DK",\n  nb: "nb-NO", sv: "sv-SE", fi: "fi-FI", pl: "pl-PL", cs: "cs-CZ", sk: "sk-SK", hu: "hu-HU", ro: "ro-RO", sl: "sl-SI", hr: "hr-HR",\n};\n\nfor (const catalog of [WESTERN_TEXT, NORTHERN_TEXT, EASTERN_TEXT]) {\n  for (const [language, namespaces] of Object.entries(catalog)) {\n    for (const [namespace, translated] of Object.entries(namespaces)) {\n      FRONTEND_TEXT[namespace][language] = { ...FRONTEND_TEXT[namespace].en, ...translated };\n    }\n  }\n}\n\nfunction normalizeLanguage(value) {\n  const normalized = String(value || "").trim().toLowerCase().replaceAll("_", "-");\n  if (!normalized) return "";\n  const base = normalized.split("-")[0];\n  if (base === "no") return "nb";\n  return base;\n}\n\nexport function languageFor(context) {\n  const explicit = normalizeLanguage(context?.language);\n  if (SUPPORTED_LANGUAGES.has(explicit)) return explicit;\n  const requested = normalizeLanguage(context?.locale?.language || (typeof navigator !== "undefined" ? navigator.language : "en") || "en");\n  return SUPPORTED_LANGUAGES.has(requested) ? requested : "en";\n}\n\nexport function localeFor(context) {\n  return LOCALE_BY_LANGUAGE[languageFor(context)] || "en-US";\n}\n\n'''
          p.write_text(text[:start]+resolver+text[textfor:])

          for name in ['trip-history-card.js','charge-history-card.js']:
              q=Path('custom_components/e_c3_dashboard/static')/name
              source=q.read_text()
              old='''        const explicit = String(this._config?.language || "").toLowerCase();\n        return ["de", "en", "fr"].includes(explicit)\n            ? { language: explicit }\n            : (this._hass || this._config);'''
              new='''        const explicit = String(this._config?.language || "").trim();\n        return explicit ? { language: explicit } : (this._hass || this._config);'''
              if old not in source:
                  raise SystemExit(f'missing card resolver anchor: {name}')
              q.write_text(source.replace(old,new,1))

          t=Path('tests/frontend-i18n.test.mjs')
          source=t.read_text()
          source=source.replace(
              'test("frontend catalog exposes German English and French namespaces", () => {',
              'test("frontend catalog exposes core namespaces and the expanded locale resolver", () => {'
          )
          source=source.replace(
              '  assert.match(catalog, /requested\\.startsWith\\("fr"\\)/);\n  assert.match(catalog, /if \\(language === "fr"\\) return "fr-FR"/);',
              '  assert.match(catalog, /const SUPPORTED_LANGUAGES = new Set/);\n  assert.match(catalog, /normalized\\.split\\("-"\\)\\[0\\]/);\n  assert.match(catalog, /if \\(base === "no"\\) return "nb"/);\n  assert.match(catalog, /fr: "fr-FR"/);\n  assert.match(catalog, /nb: "nb-NO"/);'
          )
          source=source.replace(
              '    assert.match(source, /\\["de", "en", "fr"\\]\\.includes\\(explicit\\)/);',
              '    assert.match(source, /return explicit \\? \\{ language: explicit \\} : \\(this\\._hass \\|\\| this\\._config\\)/);'
          )
          t.write_text(source)

          Path('tests/language-matrix.test.mjs').write_text('''import assert from "node:assert/strict";\nimport fs from "node:fs";\nimport vm from "node:vm";\nimport test from "node:test";\n\nconst root = new URL("../custom_components/e_c3_dashboard/", import.meta.url);\nconst languages = ["de", "en", "fr", "it", "es", "pt", "nl", "da", "nb", "sv", "fi", "pl", "cs", "sk", "hu", "ro", "sl", "hr"];\nconst extraLanguages = languages.filter((language) => !["de", "en", "fr"].includes(language));\n\nfunction keyPaths(value, prefix = "") {\n  const result = [];\n  for (const [key, child] of Object.entries(value)) {\n    const path = prefix ? `${prefix}.${key}` : key;\n    if (child && typeof child === "object" && !Array.isArray(child)) result.push(...keyPaths(child, path));\n    else result.push(path);\n  }\n  return result.sort();\n}\n\nfunction readExtra(path) {\n  const source = fs.readFileSync(new URL(path, root), "utf8");\n  const sandbox = { catalog: null };\n  vm.runInNewContext(source.replace("export const EXTRA_FRONTEND_TEXT =", "catalog ="), sandbox);\n  return sandbox.catalog;\n}\n\ntest("Home Assistant translations cover the planned 18-language matrix with identical keys", () => {\n  const canonical = JSON.parse(fs.readFileSync(new URL("translations/en.json", root), "utf8"));\n  const canonicalKeys = keyPaths(canonical);\n  for (const language of languages) {\n    const path = new URL(`translations/${language}.json`, root);\n    assert.equal(fs.existsSync(path), true, `missing translations/${language}.json`);\n    const catalog = JSON.parse(fs.readFileSync(path, "utf8"));\n    assert.deepEqual(keyPaths(catalog), canonicalKeys, `${language} translation key mismatch`);\n  }\n});\n\ntest("frontend resolver contains every planned locale and normalizes regional variants", () => {\n  const source = fs.readFileSync(new URL("static/i18n.js", root), "utf8");\n  for (const language of languages) assert.ok(source.includes(`"${language}"`), `resolver missing ${language}`);\n  assert.match(source, /normalized\\.split\\("-"\\)\\[0\\]/);\n  assert.match(source, /if \\(base === "no"\\) return "nb"/);\n  assert.match(source, /pt: "pt-PT"/);\n  assert.match(source, /cs: "cs-CZ"/);\n  assert.match(source, /nb: "nb-NO"/);\n  assert.match(source, /return SUPPORTED_LANGUAGES\\.has\\(requested\\) \\? requested : "en"/);\n});\n\ntest("all fifteen additional frontend languages provide every user-facing namespace", () => {\n  const catalogs = Object.assign({}, readExtra("static/i18n-extra-west.js"), readExtra("static/i18n-extra-north.js"), readExtra("static/i18n-extra-east.js"));\n  for (const language of extraLanguages) {\n    assert.ok(catalogs[language], `missing frontend language ${language}`);\n    for (const namespace of ["tripHistory", "chargeHistory", "vehicleOverview", "dashboard"]) {\n      assert.ok(catalogs[language][namespace], `${language} missing ${namespace}`);\n      assert.ok(Object.keys(catalogs[language][namespace]).length >= 5, `${language}/${namespace} is unexpectedly sparse`);\n    }\n  }\n});\n\ntest("long-label smoke locales are explicitly available", () => {\n  const source = fs.readFileSync(new URL("static/i18n.js", root), "utf8");\n  for (const language of ["de", "fr", "pl"]) assert.ok(source.includes(`"${language}"`));\n  const polish = readExtra("static/i18n-extra-north.js").pl;\n  assert.ok(polish.dashboard.notificationRecipients.length > 5);\n  assert.ok(polish.tripHistory.visibleTrips.includes("{visible}"));\n});\n''')

          for workflow in [
              '.github/workflows/dev-expand-language-matrix.yml',
              '.github/workflows/dev-i18n-matrix-diagnose.yml',
              '.github/workflows/dev-i18n-wiring-diagnose.yml',
              '.github/workflows/dev-i18n-finalize.yml',
          ]:
              path=Path(workflow)
              if path.exists(): path.unlink()
          PY
      - name: Validate final language matrix
        run: |
          python -m compileall -q custom_components/e_c3_dashboard
          for file in custom_components/e_c3_dashboard/static/*.js; do node --check "$file"; done
          node --test tests/*.test.mjs
          git diff --check
      - name: Commit final language matrix
        run: |
          git config user.name "CaneTLOTW"
          git config user.email "35076818+CaneTLOTW@users.noreply.github.com"
          git add -A
          git commit -m "i18n: support planned 18-language matrix"
          git push origin HEAD:develop
