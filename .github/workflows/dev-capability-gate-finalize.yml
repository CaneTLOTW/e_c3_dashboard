name: Dev finalize vehicle capability gate

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/dev-capability-gate-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Reuse guarded refactor and update stale tests
        shell: python
        run: |
          from pathlib import Path

          workflow = Path('.github/workflows/dev-capability-gate-once.yml').read_text()
          marker = '      - name: Apply guarded capability refactor\n        shell: python\n        run: |\n'
          end_marker = '\n      - name: Validate capability refactor\n'
          if workflow.count(marker) != 1 or workflow.count(end_marker) != 1:
              raise SystemExit('could not locate guarded refactor script')
          script = workflow.split(marker, 1)[1].split(end_marker, 1)[0]
          lines = []
          for line in script.splitlines():
              if line.startswith('          '):
                  lines.append(line[10:])
              elif not line.strip():
                  lines.append('')
              else:
                  raise SystemExit(f'unexpected refactor indentation: {line!r}')
          exec('\n'.join(lines), {'__name__': '__main__'})

          slug_test = Path('tests/config-flow-vehicle-slug.test.mjs')
          text = slug_test.read_text()
          old = '  assert.match(flow, /vol\\.Optional\\(CONF_VEHICLE_SLUG\\): str/);'
          new = '  assert.match(flow, /fields\\[vol\\.Optional\\(CONF_VEHICLE_SLUG\\)\\] = str/);'
          if text.count(old) != 1:
              raise SystemExit('slug test anchor mismatch')
          slug_test.write_text(text.replace(old, new, 1))

          hero_test = Path('tests/vehicle-overview-card.test.mjs')
          text = hero_test.read_text()
          replacements = {
              '  assert.match(source, /entity: autonomy/);': '  assert.match(source, /entity: rangeEntity/);',
              '  assert.match(source, /states\\[.*autonomy/);': '  assert.match(source, /states\\[.*rangeEntity/);',
              '  assert.match(source, /triggers_update: \\[battery, batteryResidual, charging, engine, chargePower, tripEnergy\\]/);': '  assert.match(source, /triggers_update: \\[primaryLevel, battery, batteryResidual, fuel, charging, engine, chargePower, tripEnergy\\]/);',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'hero test anchor mismatch: {old}')
              text = text.replace(old, new, 1)
          hero_test.write_text(text)

          # The reused guarded script deletes the original one-shot workflow.
          # Remove this finalizer as well so only durable CI remains.
          Path('.github/workflows/dev-capability-gate-finalize.yml').unlink()

      - name: Validate finalized capability refactor
        run: |
          python -m compileall -q custom_components/e_c3_dashboard
          for file in custom_components/e_c3_dashboard/static/*.js; do node --check "$file"; done
          node --test tests/*.test.mjs
          git diff --check

      - name: Commit finalized capability refactor
        run: |
          git config user.name "CaneTLOTW"
          git config user.email "35076818+CaneTLOTW@users.noreply.github.com"
          git add -A
          git commit -m "vehicle: gate dashboard by powertrain capabilities"
          git push origin HEAD:develop
