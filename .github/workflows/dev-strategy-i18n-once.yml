name: Dev strategy i18n once

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/dev-strategy-i18n-once.yml

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Localize dashboard strategy
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {count}: {old[:120]!r}")
              file.write_text(text.replace(old, new, 1))

          i18n = "custom_components/e_c3_dashboard/static/i18n.js"
          replace_once(
              i18n,
              '      ageUnknown: "time unknown", sinceJustNow: "since just now", sinceMinutes: "for {value} min", sinceHours: "for {value} hr", sinceDays: "for {value} days", connected: "Connected", disconnected: "Disconnected", unknown: "Unknown",',
              '      ageUnknown: "time unknown", sinceJustNow: "since just now", sinceMinutes: "for {value} min", sinceHours: "for {value} hr", sinceDays: "for {value} days", connected: "Connected", disconnected: "Disconnected", unknown: "Unknown",\n      brand: "Brand", powertrain: "Powertrain", chargeLimitEnabled: "Charging limit enabled", chargeEndShort: "End", serviceBattery: "12 V battery",\n      tripHistoryIntro: "Completed trips come from Stellantis server history and can be older than 90 days. Energy and consumption are SOC-based estimates; unreliable values are shown as **—**. Older entries load as you scroll.", syncServerHistory: "Update server history",\n      privacySharing: "Privacy & sharing", privacyDataSharing: "Privacy / data sharing", unrestricted: "Unrestricted", restricted: "Restricted",\n      refreshInterval: "Refresh interval", correctBatteryValues: "Correct battery values", abrpLiveData: "ABRP live data",\n      strategyEditorDescription: "This dashboard uses the previously configured e-C3 Dashboard integration. Creating it does not change existing vehicle dashboards or entities.",',
          )
          replace_once(
              i18n,
              '      ageUnknown: "Zeit unbekannt", sinceJustNow: "seit gerade eben", sinceMinutes: "seit {value} Min.", sinceHours: "seit {value} Std.", sinceDays: "seit {value} Tagen", connected: "Verbunden", disconnected: "Getrennt", unknown: "Unbekannt",',
              '      ageUnknown: "Zeit unbekannt", sinceJustNow: "seit gerade eben", sinceMinutes: "seit {value} Min.", sinceHours: "seit {value} Std.", sinceDays: "seit {value} Tagen", connected: "Verbunden", disconnected: "Getrennt", unknown: "Unbekannt",\n      brand: "Marke", powertrain: "Antrieb", chargeLimitEnabled: "Ladelimit aktiv", chargeEndShort: "Ende", serviceBattery: "12-V-Batterie",\n      tripHistoryIntro: "Abgeschlossene Fahrten stammen aus der Stellantis-Serverhistorie und können älter als 90 Tage sein. Energie- und Verbrauchswerte sind SOC-basierte Näherungen; nicht belastbare Werte werden als **—** angezeigt. Beim Scrollen werden ältere Einträge nachgeladen.", syncServerHistory: "Serverhistorie aktualisieren",\n      privacySharing: "Datenschutz & Freigabe", privacyDataSharing: "Datenschutz / Datenfreigabe", unrestricted: "Uneingeschränkt", restricted: "Eingeschränkt",\n      refreshInterval: "Aktualisierungsintervall", correctBatteryValues: "Korrektur Batteriewerte", abrpLiveData: "ABRP Live-Daten",\n      strategyEditorDescription: "Dieses Dashboard verwendet die zuvor eingerichtete e-C3-Dashboard-Integration. Beim Erstellen werden keine vorhandenen Fahrzeug-Dashboards oder Entitäten verändert.",',
          )
          replace_once(
              i18n,
              '      ageUnknown: "heure inconnue", sinceJustNow: "depuis un instant", sinceMinutes: "depuis {value} min", sinceHours: "depuis {value} h", sinceDays: "depuis {value} jours", connected: "Connecté", disconnected: "Déconnecté", unknown: "Inconnu",',
              '      ageUnknown: "heure inconnue", sinceJustNow: "depuis un instant", sinceMinutes: "depuis {value} min", sinceHours: "depuis {value} h", sinceDays: "depuis {value} jours", connected: "Connecté", disconnected: "Déconnecté", unknown: "Inconnu",\n      brand: "Marque", powertrain: "Motorisation", chargeLimitEnabled: "Limite de recharge activée", chargeEndShort: "Fin", serviceBattery: "Batterie 12 V",\n      tripHistoryIntro: "Les trajets terminés proviennent de l’historique serveur Stellantis et peuvent dater de plus de 90 jours. L’énergie et la consommation sont des estimations basées sur le SOC ; les valeurs non fiables sont affichées comme **—**. Les entrées plus anciennes se chargent pendant le défilement.", syncServerHistory: "Mettre à jour l’historique serveur",\n      privacySharing: "Confidentialité et partage", privacyDataSharing: "Confidentialité / partage des données", unrestricted: "Sans restriction", restricted: "Restreint",\n      refreshInterval: "Intervalle d’actualisation", correctBatteryValues: "Corriger les valeurs de batterie", abrpLiveData: "Données Live ABRP",\n      strategyEditorDescription: "Ce tableau de bord utilise l’intégration e-C3 Dashboard configurée auparavant. Sa création ne modifie aucun tableau de bord véhicule ni aucune entité existante.",',
