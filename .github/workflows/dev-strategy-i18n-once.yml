    strategyType: "dashboard",
    name: "e-C3 Dashboard",
    description: "Vehicle dashboard for Stellantis Vehicles",
  });
}''',
              '''const strategyRegistrationStrings = t({
  locale: { language: typeof navigator !== "undefined" ? navigator.language : "en" },
});
window.customStrategies = window.customStrategies || [];
if (!window.customStrategies.some((strategy) => strategy.type === STRATEGY_TYPE)) {
  window.customStrategies.push({
    type: STRATEGY_TYPE,
    strategyType: "dashboard",
    name: strategyRegistrationStrings.name,
    description: strategyRegistrationStrings.description,
  });
}''',
          )

          strategy_text = Path(strategy).read_text()
          if 'language(hass) === "de"' in strategy_text:
              raise SystemExit("dashboard strategy still contains direct DE/EN language branching")
          for forbidden in [
              "Zeit unbekannt",
              "seit gerade eben",
              "Verbunden",
              "Getrennt",
              "Datenschutz & Freigabe",
              "ABRP Live-Daten",
              "Dieses Dashboard verwendet die zuvor eingerichtete",
              "Keine GPS-Koordinaten verfügbar.",
          ]:
              if forbidden in strategy_text:
                  raise SystemExit(f"dashboard strategy still contains hard-coded localized UI text: {forbidden}")

          architecture = "tests/frontend-architecture.test.mjs"
          replace_once(
              architecture,
              '''test("vehicle information popup puts maintenance before vehicle data", () => {
  const maintenance = strategy.indexOf('title: language(hass) === "de" ? "Wartung" : "Maintenance"');
  const vehicle = strategy.indexOf('title: language(hass) === "de" ? "Fahrzeug" : "Vehicle"');''',
              '''test("vehicle information popup puts maintenance before vehicle data", () => {
  const maintenance = strategy.indexOf("title: strings.maintenance");
  const vehicle = strategy.indexOf("title: strings.vehicle");''',
          )
          replace_once(architecture, '  assert.match(strategy, /"Datenschutz & Freigabe"/);', '  assert.match(strategy, /separator\(strings\.privacySharing/);')

          frontend_i18n = "tests/frontend-i18n.test.mjs"
          replace_once(
              frontend_i18n,
              'const vehicle = read("../custom_components/e_c3_dashboard/static/vehicle-overview-card.js");',
              'const vehicle = read("../custom_components/e_c3_dashboard/static/vehicle-overview-card.js");\nconst strategy = read("../custom_components/e_c3_dashboard/static/e_c3_dashboard.js");',
          )
          file = Path(frontend_i18n)
          text = file.read_text()
          text += '''\n\ntest("dashboard strategy uses catalog strings without binary German branches", () => {\n  assert.doesNotMatch(strategy, /language\\(hass\\) === "de"/);\n  for (const key of [\n    "vehicleMaintenanceData", "maintenance", "brand", "powertrain",\n    "chargeLimitEnabled", "serviceBattery", "tripHistoryIntro", "syncServerHistory",\n    "privacySharing", "privacyDataSharing", "refreshInterval", "correctBatteryValues",\n    "abrpLiveData", "strategyEditorDescription",\n  ]) {\n    assert.match(strategy, new RegExp(`strings\\.${key}`));\n  }\n  assert.doesNotMatch(strategy, /Zeit unbekannt|seit gerade eben|Verbunden|Getrennt|ABRP Live-Daten/);\n});\n'''
          file.write_text(text)

          # Self-delete this one-shot workflow from the resulting source commit.
          Path(".github/workflows/dev-strategy-i18n-once.yml").unlink()

